services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql

    queue:
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - laravel.test
        command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        restart: unless-stopped
        ports:
            - '${FRONTEND_PORT:-3000}:3000'
        environment:
            NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-http://localhost/api}'
            API_INTERNAL_URL: 'http://host.docker.internal/api'
            LARAVEL_SAIL: '1'
            NEXT_PUBLIC_APP_URL: '${FRONTEND_URL:-http://localhost:3000}'
            NEXT_PUBLIC_GOOGLE_CLIENT_ID: '${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}'
            WATCHPACK_POLLING: 'true'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - './frontend:/app'
            - '/app/node_modules'
        networks:
            - sail
        depends_on:
            - laravel.test
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000']
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 30s

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
